name: docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and verify the production container
        env:
          DOCKER_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: pnpm run verify:docker

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then docker tag "$IMAGE" "$tag"; docker push "$tag"; fi
          done
